<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/results.css">
</head>
<body>
    <header>
        <h1>Your Results...</h1>
    </header>

    <div class="nav-buttons">
        <a href="/main" class="nav-button">Home</a>
    </div>

    <div class="carousel-container">
        <div class="carousel-inner" id="carouselItems">
            {{#recommendations}}
            <div class="carousel-item">
                {{#url}}
                <img src="{{url}}" alt="{{title}} Cover">
                {{/url}}
                {{^url}}
                <div class="cover-placeholder">Cover Unavailable</div>
                {{/url}}
                <h3>{{title}}</h3>
                <p><strong>Author:</strong> {{author}}</p>
            </div>
            {{/recommendations}}
        </div>
    </div>

    <div class="carousel-nav">
        <button id="prevBtn" onclick="prevBook()">←</button>
        <button id="nextBtn" onclick="nextBook()">→</button>
    </div>

    <script src="/carousel.js"></script>
</body>
</html>
