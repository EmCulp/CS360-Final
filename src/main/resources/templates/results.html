<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Results</title>
</head>
<body>
    <header>
        <h1>Your Results...</h1>
    </header>
    <div id="results"></div>

    <script>
        const results = JSON.parse(sessionStorage.getItem('surveyResults'));

        if(results){
            let resultHTML = '<ul>';
            for(const question in results){
                resultHTML += '<li><strong>${question}:</strong> ${results[question]}</li>'>;
            }
            resultHTML += '</ul>';
            document.getElementById('results').innerHTML = resultHTML;
        }else{
            document.getElementById('results').innerHTML = 'No results found.'
        }
    </script>
</body>
</html>
