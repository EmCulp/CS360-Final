<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login / Signup</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/login.css">
</head>
<body>
    <div class="auth-container">
        <div class="toggle-buttons">
            <button id="loginToggle" class="active" type="button">Login</button>
            <button id="signupToggle" type="button">Sign Up</button>
        </div>

        <div id="loginForm" class="form-container active">
            <form method="POST" action="/login">
                <label for="username">Username</label><br>
                <input type="text" id="username" name="username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Log In</button>
            </form>
        </div>
        <div id="signupForm" class="form-container">
            <form action="/signup" method="POST">
                <label for="signup-name">Name</label>
                <input type="text" id="signup-name" name="name" required>

                <label for="signup-username">Username</label>
                <input type="text" id="signup-username" name="username" required>

                <label for="signup-email">Email</label>
                <input type="text" id="signup-email" name="email" required>

                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" name="password" required>

                <label for="signup-confirm-password">Confirm Password</label>
                <input type="password" id="signup-confirm-password" name="confirmPassword" required>

                <button type="submit">Sign Up</button>
            </form>
        </div>
    </div>
    <script>
        document.querySelector('form[action="/signup"]').addEventListener('submit', function(event) {
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm-password').value;

            if (password !== confirmPassword) {
                event.preventDefault(); // Stop form submission
                alert("Passwords do not match. Please try again.");
            }
        });

        const loginToggle = document.getElementById('loginToggle');
        const signupToggle = document.getElementById('signupToggle');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');

        loginToggle.addEventListener('click', () => {
            loginForm.classList.add('active');
            signupForm.classList.remove('active');
            loginToggle.classList.add('active');
            signupToggle.classList.remove('active');
        });
        signupToggle.addEventListener('click', () => {
            signupForm.classList.add('active');
            loginForm.classList.remove('active');
            signupToggle.classList.add('active');
            loginToggle.classList.remove('active');
        });
    </script>
</body>
</html>
