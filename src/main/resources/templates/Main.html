<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Recommendation System</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>Book Recommendation System</h1>
    </header>

    <div class="nav-buttons">
        <a href="/BooksRead" class="nav-button">Books You've Read</a>
    </div>

    <div class="survey-container">
        <form id="surveyForm" onsubmit="saveResults(event)">
            <div class="question"><label for="genre">What genre do you prefer?</label></div>
            <select id="genre" name="genre">
                <option value="1">Biography/Autobiography</option>
                <option value="2">Comic</option>
                <option value="3">Drama</option>
                <option value="4">Essay</option>
                <option value="5">Fable</option>
                <option value="6">Fairy Tale</option>
                <option value="7">Fantasy</option>
                <option value="8">Fiction</option>
                <option value="9">Fiction In Verse</option>
                <option value="10">Folklore</option>
                <option value="11">Historical Fiction</option>
                <option value="12">Horror</option>
                <option value="13">Humor</option>
                <option value="14">Legend</option>
                <option value="15">Magna</option>
                <option value="16">Mystery</option>
                <option value="17">Mythology</option>
                <option value="18">Narrative Nonfiction</option>
                <option value="19">Nonfiction</option>
                <option value="20">Poetry</option>
                <option value="21">Realistic Fiction</option>
                <option value="22">Science Fiction</option>
                <option value="23">Short Story</option>
                <option value="24">Speech</option>
                <option value="25">Tall Tale</option>
            </select>
            <div class="question"><label>Select the tones of the book:</label><br></div>
            <div class="answer-option">
                <div class="answer-options">
                    <input type="checkbox" id="hopeful" name="tones" value="26">
                    <label for="hopeful">Hopeful</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="tense" name="tones" value="27">
                    <label for="tense">Tense</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="romantic" name="tones" value="28">
                    <label for="romantic">Romantic</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="dark" name="tones" value="29">
                    <label for="dark">Dark</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="whimsical" name="tones" value="30">
                    <label for="whimsical">Whimsical</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="mysterious" name="tones" value="31">
                    <label for="mysterious">Mysterious</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="cynical" name="tones" value="32">
                    <label for="cynical">Cynical</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="suspenseful" name="tones" value="33">
                    <label for="suspenseful">Suspenseful</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="grim" name="tones" value="34">
                    <label for="grim">Grim</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="reflective" name="tones" value="35">
                    <label for="reflective">Reflective</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="eerie" name="tones" value="36">
                    <label for="eerie">Eerie</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="dramatic" name="tones" value="37">
                    <label for="dramatic">Dramatic</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="playful" name="tones" value="38">
                    <label for="playful">Playful</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="sincere" name="tones" value="39">
                    <label for="sincere">Sincere</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="uplifting" name="tones" value="40">
                    <label for="uplifting">Uplifting</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="somber" name="tones" value="41">
                    <label for="somber">Somber</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="gripping" name="tones" value="42">
                    <label for="gripping">Gripping</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="lyrical" name="tones" value="43">
                    <label for="lyrical">Lyrical</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="adventurous" name="tones" value="44">
                    <label for="adventurous">Adventurous</label>
                </div>
            </div>
            <div class="question"><label>Do you prefer fast-paced or slow-paced books?</label></div>
            <div class="a">
                <div class="answer-option">
                    <input type="radio" id="fast" name="pace" value="45">
                    <label for="fast">Fast-Paced</label><br>
                </div>
                <div class="answer-option">
                    <input type="radio" id="slow" name="pace" value="46">
                    <label for="slow">Slow-Paced</label><br>
                </div>
            </div>
            <div class="question"><label>What type of protagonist do you prefer?</label></div>
            <div class="a">
                <div class="a-option">
                    <input type="radio" id="hero" name="protagonist" value="47">
                    <label for="hero">Hero</label>
                </div>
                <div class="a-option">
                    <input type="radio" id="antiheroes" name="protagonist" value="48">
                    <label for="antiheroes">Antiheroes</label>
                </div>
                <div class="a-option">
                    <input type="radio" id="protagonist" name="protagonist" value="49">
                    <label for="protagonist">Protagonist</label>
                </div>
                <div class="a-option">
                    <input type="radio" id="supPro" name="protagonist" value="50">
                    <label for="supPro">Supporting Protagonists</label>
                </div>
            </div>
            <div class="question"><label>Would you prefer a book with a happy or sad ending?</label></div>
            <div class="a">
                <div class="answer-option">
                    <input type="radio" id="happy" name="ending" value="51">
                    <label for="happy">Happy</label><br>
                </div>
                <div class="answer-option">
                    <input type="radio" id="sad" name="ending" value="52">
                    <label for="sad">Sad</label><br>
                </div>
            </div>
            <div class="question"><label>Do you like books with a lot of action, or do you prefer character development?</label></div>
            <div class="a">
                <div class="answer-option">
                    <input type="radio" id="action" name="a/cd" value="53">
                    <label for="action">Action</label>
                </div>
                <div class="answer-option">
                    <input type="radio" id="chardev" name="a/cd" value="54">
                    <label for="chardev">Character Development</label>
                </div>
            </div>
            <div class="question"><label for="romance">How much romance do you prefer in a book?</label></div>
            <select id="romance" name="romance">
                <option value="55">None</option>
                <option value="56">A little</option>
                <option value="57">A good bit</option>
                <option value="58">A lot</option>
            </select>
            <div class="question"><label>Do you like books with a lot of twists and surprises, or do you prefer a predictable storyline?</label></div>
            <div class="a">
                <div class="answer-option">
                    <input type="radio" id="twists" name="twists/predict" value="59">
                    <label for="twists">Twists and Surprises</label>
                </div>
                <div class="answer-option">
                    <input type="radio" id="predict" name="twists/predict" value="60">
                    <label for="predict">Predictable</label>
                </div>
            </div>
            <div class="question"><label for="supernatural">How do you feel about books with a supernatural or fantastical element?</label></div>
            <select id="supernatural" name="supernatural">
                <option value="61">I love them - the mote magic or mystery, the better!</option>
                <option value="62">I enjoy them occasionally</option>
                <option value="63">I'm neutral - it depends on the story</option>
                <option value="64">I usually prefer realistic stories</option>
                <option value="65">I avoid supernatural or fantastical themes</option>
            </select>
            <div class="question"><label>What setting do you enjoy most in a book?</label></div>
            <div class="ans-option">
                <div class="answer-options">
                    <input type="checkbox" id="historical" name="setting" value="66">
                    <label for="historical">Historical (e.g., Victorian era, Ancient Rome)</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="futuristic" name="setting" value="67">
                    <label for="futuristic">Futuristic / Sci-fi worlds</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="fantasy" name="setting" value="68">
                    <label for="fantasy">Fantasy Realms (e.g., magical kingdoms, mythical lands)</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="modern" name="setting" value="69">
                    <label for="modern">Modern-day / Contemporary settings</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="small" name="setting" value="70">
                    <label for="small">Small towns or close-knit communities</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="big" name="setting" value="71">
                    <label for="big">Big cities / Urban life</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="dystopian" name="setting" value="72">
                    <label for="dystopian">Dystopian or post-apocalyptic worlds</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="nature" name="setting" value="73">
                    <label for="nature">Nature-based / Wilderness adventures</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="otherworldly" name="setting" value="74">
                    <label for="otherworldly">Otherworldly / Parallel universes</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="depends" name="setting" value="75">
                    <label for="depends">It depends on the plot</label>
                </div>
            </div>
            <div class="question"><label>How long do you prefer your books to be?</label></div>
            <div class="an-op">
                <div class="answer-option">
                    <input type="radio" id="vshort" name="pages" value="76">
                    <label for="vshort">Very Short (under 150 pages)</label>
                </div>
                <div class="answer-option">
                    <input type="radio" id="short" name="pages" value="77">
                    <label for="short">Short (150-300 pages)</label>
                </div>
                <div class="answer-option">
                    <input type="radio" id="medium" name="pages" value="78">
                    <label for="medium">Medium (300-500 pages)</label>
                </div>
                <div class="answer-option">
                    <input type="radio" id="long" name="pages" value="79">
                    <label for="long">Long (500-700 pages)</label>
                </div>
                <div class="answer-option">
                    <input type="radio" id="epic" name="pages" value="80">
                    <label for="epic">Epic (700+ pages)</label>
                </div>
                <div class="answer-option">
                    <input type="radio" id="no" name="pages" value="81">
                    <label for="no">No preference - story > length</label>
                </div>
            </div>
            <div class="question"><label>What writing style do you prefer in a book?</label></div>
            <div class="ans-option">
                <div class="answer-options">
                    <input type="checkbox" id="descriptive" name="style" value="82">
                    <label for="descriptive">Descriptive and Lush - rich in imagery, sensory detail</label><br>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="concise" name="style" value="83">
                    <label for="concise">Concise and Straightforward - to-the-point, minimal fluff</label><br>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="flowery" name="style" value="84">
                    <label for="flowery">Flowery and Poetic - lyrical and expressive language</label><br>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="conversational" name="style" value="85">
                    <label for="conversational">Conversational - casual, like the author is talking to you</label><br>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="fastaction" name="style" value="86">
                    <label for="fastaction">Fast-paced and Action-Oriented - minimal exposition, lots of movement</label><br>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="r" name="style" value="87">
                    <label for="r">Reflective and Thoughtful - introspective and character-focused</label><br>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="experimental" name="style" value="88">
                    <label for="experimental">Experimental or Non-Linear - plays with form, timeline, or perspective</label><br>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="witty" name="style" value="89">
                    <label for="witty">Satirical or Witty - clever, humorous, or biting tone</label><br>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="d" name="style" value="90">
                    <label for="d">Dark and Atmospheric - moody, immersive, emotionally intense</label><br>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="none" name="style" value="91">
                    <label for="none">No Preferences - I enjoy a variety of writing styles</label><br>
                </div>
            </div>
            <div class="question"><label>Would you like to read books with themes of...</label></div>
            <div class="ans-option">
                <div class="answer-options">
                    <input type="checkbox" id="adventure" name="theme" value="92">
                    <label for="adventure">Adventure - Exploring new worlds or thrilling journeys</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="love" name="theme" value="93">
                    <label for="love">Love/Romance - Romantic relationships and emotional connections</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="friendship" name="theme" value="94">
                    <label for="friendship">Friendship - the power of friendships and bonds between characters</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="mystery" name="theme" value="95">
                    <label for="mystery">Mystery / Thriller - unraveling secrets or solving problems</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="fant" name="theme" value="96">
                    <label for="fant">Fantasy - Magical realms and mythical creatures</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="age" name="theme" value="97">
                    <label for="age">Coming of Age - Personal growth and self-discovery</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="history" name="theme" value="98">
                    <label for="history">Historical - set in a particular historical period</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="science" name="theme" value="99">
                    <label for="science">Science Fiction - futuristic world or advanced technology</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="horror" name="theme" value="100">
                    <label for="horror">Horror - dark, eerie, or supernatural elements</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="political" name="theme" value="101">
                    <label for="political">Political / Philosophical - Society, governance, or exploring deep ideas</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="issues" name="theme" value="102">
                    <label for="issues">Social Issues - exploring real-world societal challenges</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="dynamics" name="theme" value="103">
                    <label for="dynamics">Family Dynamics - relationships and conflicts with families</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="survival" name="theme" value="104">
                    <label for="survival">Survival - Overcoming life-threatening situations or environments</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="humor" name="theme" value="105">
                    <label for="humor">Humor - lighthearted, comedic, and fun</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="loss" name="theme" value="106">
                    <label for="loss">Grief / Loss - Exploring themes of mourning and healing</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="redemption" name="theme" value="107">
                    <label for="redemption">Redemption - Characters seeking personal transformation or redemption</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="faith" name="theme" value="108">
                    <label for="faith">Faith / Spirituality - Themes of belief, purpose, or the divine</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="law" name="theme" value="109">
                    <label for="law">Justice / Law - Focus on legal struggles or moral dilemmas</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="sports" name="theme" value="110">
                    <label for="sports">Sports - competitive athletic pursuits, teamwork, and overcoming challenges</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="teamwork" name="theme" value="111">
                    <label for="teamwork">Teamwork and Competition - Working with others to achieve a common goal or competing to be the best</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="achievement" name="theme" value="112">
                    <label for="achievement">Victory and Achievement - Overcoming obstacles to reach success</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="training" name="theme" value="113">
                    <label for="training">Training and Dedication - the process of hard work and discipline</label>
                </div>
                <div class="answer-options">
                    <input type="checkbox" id="inspiration" name="theme" value="114">
                    <label for="inspiration">Inspiration from Athletes - stories of athletes overcoming adversity or achieving greatness</label>
                </div>
            </div>

            <div class="button-container">
                <button type="submit">Submit</button>
            </div>
        </form>
    </div>


    <script>
        let validAnswerOptions = {};

        // Fetch valid answer options from backend
        fetch('/getAnswerOptions')
            .then(res => res.json())
            .then(data => {
                data.forEach(entry => {
                    const qid = entry.question_id;
                    const optionId = entry.option_id; // The id of the answer option
                    const answer = entry.answer; // The text of the answer (optional)
                    if (!validAnswerOptions[qid]) {
                        validAnswerOptions[qid] = new Map();
                    }
                    validAnswerOptions[qid].set(optionId, answer); // Store option_id with the answer text
                });
            })
            .catch(err => {
                console.error("Failed to load answer options:", err);
            });

        function saveResults(event) {
            event.preventDefault();  // Prevent form refresh

            const results = [];

            // Collect answers for each question
            const genre = document.getElementById('genre');
            if (genre) {
                results.push({ question_id: 1, answer: [genre.value] }); // Using option_id directly
            }

            const toneCheckboxes = document.querySelectorAll('input[name="tones"]:checked');
            const selectedTones = [];
            toneCheckboxes.forEach(checkbox => {
                selectedTones.push(checkbox.value); // Using option_id directly
            });
            if (selectedTones.length > 0) {
                results.push({ question_id: 2, answer: selectedTones });
            }

            const pace = document.querySelector('input[name="pace"]:checked');
            if (pace) {
                results.push({ question_id: 3, answer: [pace.value] });
            }

            const protagonist = document.querySelector('input[name="protagonist"]:checked');
            if (protagonist) {
                results.push({ question_id: 4, answer: [protagonist.value] });
            }

            const end = document.querySelector('input[name="ending"]:checked');
            if (end) {
                results.push({ question_id: 5, answer: [end.value] });
            }

            const acd = document.querySelector('input[name="a/cd"]:checked');
            if (acd) {
                results.push({ question_id: 6, answer: [acd.value] });
            }

            const romance = document.getElementById('romance');
            if (romance) {
                results.push({ question_id: 7, answer: [romance.value] });
            }

            const tp = document.querySelector('input[name="twists/predict"]:checked');
            if (tp) {
                results.push({ question_id: 8, answer: [tp.value] });
            }

            const supernatural = document.getElementById('supernatural');
            if (supernatural) {
                results.push({ question_id: 9, answer: [supernatural.value] });
            }

            const setCheckboxes = document.querySelectorAll('input[name="setting"]:checked');
            const selectedSet = [];
            setCheckboxes.forEach(checkbox => {
                selectedSet.push(checkbox.value); // Using option_id directly
            });
            if (selectedSet.length > 0) {
                results.push({ question_id: 10, answer: selectedSet });
            }

            const pages = document.querySelector('input[name="pages"]:checked');
            if (pages) {
                results.push({ question_id: 11, answer: [pages.value] });
            }

            const styleBoxes = document.querySelectorAll('input[name="style"]:checked');
            const selectedStyles = [];
            styleBoxes.forEach(checkbox => {
                selectedStyles.push(checkbox.value); // Using option_id directly
            });
            if (selectedStyles.length > 0) {
                results.push({ question_id: 12, answer: selectedStyles });
            }

            const themeBoxes = document.querySelectorAll('input[name="theme"]:checked');
            const selectedThemes = [];
            themeBoxes.forEach(checkbox => {
                selectedThemes.push(checkbox.value); // Using option_id directly
            });
            if (selectedThemes.length > 0) {
                results.push({ question_id: 13, answer: selectedThemes });
            }

            const obj = {
                resp: results
            };

            // Send the corrected array to the backend
            fetch('/submitSurvey', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(obj)
            })
            .then(response => response.text())
            .then(data => {
                console.log('Survey submitted successfully:', data);
                window.location.href = "/results";
            })
            .catch(error => {
                console.error('Error submitting survey:', error);
            });
        }

        // Attach event listener to the form submit button
        document.getElementById('surveyForm').addEventListener('submit', saveResults);
    </script>



</body>
</html>
